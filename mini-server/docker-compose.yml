services:
  to-doom:
    image: node:20-alpine
    container_name: to-doom
    working_dir: /app
    command: sh -c "npm install --omit=dev && node server.js"
    environment:
      - PORT=3456
      - TODOOM_SERVER=
    ports:
      - "3456:3456"
    volumes:
      - ./:/app
      - ./data:/app/data
    restart: unless-stopped

